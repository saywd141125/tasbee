<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تطبيق التسبيح</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1b5e20, #66bb6a);
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

.button-card {
    background: white;
    padding: 50px 40px;
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    text-align: center;
    max-width: 350px;
    width: 90%;
    animation: fadeIn 0.8s ease;
}

h1 {
    color: #1b5e20;
    margin-bottom: 30px;
    font-size: 28px;
    font-weight: 700;
}

button {
    padding: 18px 35px;
    font-size: 22px;
    border-radius: 12px;
    border: none;
    background: #1b5e20;
    color: white;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

button:hover {
    background: #145a32;
    transform: translateY(-2px);
}

.footer {
    margin-top: 20px;
    font-size: 14px;
    color: #2e7d32;
    font-weight: 600;
    letter-spacing: 0.4px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="button-card">
    <h1>📿 تطبيق التسبيح</h1>
    <button onclick="start()">دخول</button>
    <div class="footer">Eng: Sayed Hussein</div>
</div>

<script>
function start() {
    window.location.href = "tasbeeh.html";
}
</script>

</body>
</html>
