<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>التسبيح</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    transition: background 0.5s, color 0.5s;
}

body.light {
    background: linear-gradient(135deg, #1b5e20, #66bb6a);
    color: #000;
}

body.dark {
    background: #121212;
    color: #ddd;
}

.card {
    background: #fff;
    width: 460px;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    text-align: center;
    transition: background 0.5s, color 0.5s;
}

body.dark .card {
    background: #1e1e1e;
    color: #ddd;
}

h1 { margin-bottom: 20px; }
.zikr {
    background: #f1f8f4;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    transition: background 0.5s, color 0.5s;
}
body.dark .zikr { background: #2c2c2c; color: #ddd; }

.title { font-weight: 600; margin-bottom: 8px; }
.counter, .daily { font-size: 18px; margin-bottom: 8px; }
.controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s;
}
button:hover { opacity: 0.8; }
button.zikr-btn { background: #1b5e20; color: white; }
button.reset { background: #c62828; color: white; }
.done { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #1b5e20; display: inline-block; margin-top: 8px; }
.done.active { background: #1b5e20; }

.custom { border-top: 1px solid #ddd; padding-top: 15px; }
input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 8px; }
.footer { margin-top: 15px; font-size: 12px; color: #777; }

.toggle-theme {
    margin-bottom: 20px;
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    background: #ff9800;
    color: #fff;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="card">
    <h1>📿 التسبيح</h1>

    <button class="toggle-theme" onclick="toggleTheme()">تبديل الوضع ليلي / نهاري</button>

    <div id="zikrs"></div>

    <div class="custom">
        <input type="text" id="newZikr" placeholder="أدخل تسبيحة جديدة">
        <button onclick="addZikr()">➕ إضافة تسبيحة</button>
    </div>

    <div class="footer">Eng: Sayed Hussein</div>
</div>

<script>
const max = 33;

let zikrList = JSON.parse(localStorage.getItem("zikrList")) || [
    { text: "سبحان الله", count: 0, daily: 0 },
    { text: "الحمد لله", count: 0, daily: 0 },
    { text: "الله أكبر", count: 0, daily: 0 }
];

function saveData() {
    localStorage.setItem("zikrList", JSON.stringify(zikrList));
}

function render() {
    const container = document.getElementById("zikrs");
    container.innerHTML = "";

    zikrList.forEach((z, i) => {
        container.innerHTML += `
        <div class="zikr">
            <div class="title">${z.text}</div>
            <div class="counter">دورة: ${z.count} / 33</div>
            <div class="daily">عدد الدورات اليوم: ${z.daily}</div>
            <div class="controls">
                <button class="zikr-btn" onclick="inc(${i})">تسبيح</button>
                <button class="reset" onclick="reset(${i})">إعادة</button>
            </div>
            <div class="done ${z.count === max ? 'active' : ''}"></div>
        </div>
        `;
    });
}

function inc(i) {
    if(zikrList[i].count < max) {
        zikrList[i].count++;
        if(zikrList[i].count === max) {
            zikrList[i].daily++;
        }
        saveData();
        render();
    }
}

// إعادة العداد
function reset(i) {
    zikrList[i].count = 0;
    saveData();
    render();
}

function addZikr() {
    let text = document.getElementById("newZikr").value.trim();
    if(text === "") { alert("اكتب التسبيحة أولاً"); return; }
    zikrList.push({ text, count:0, daily:0 });
    document.getElementById("newZikr").value = "";
    saveData();
    render();
}

function toggleTheme() {
    if(document.body.classList.contains("light")) {
        document.body.classList.remove("light");
        document.body.classList.add("dark");
        localStorage.setItem("theme", "dark");
    } else {
        document.body.classList.remove("dark");
        document.body.classList.add("light");
        localStorage.setItem("theme", "light");
    }
}

const savedTheme = localStorage.getItem("theme") || "light";
document.body.classList.add(savedTheme);

render();
</script>

</body>
</html>
